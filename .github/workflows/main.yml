name: Scrape RSS & Export ke Blogger XML

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests beautifulsoup4 lxml

      - name: Jalankan Scrape & Export
        run: python export_blogger.py

      - name: Commit & Push XML
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Simpan database (agar scraping berikutnya tidak mengulang) dan file XML
          git add database_hasil5/ export_blogger.xml || true
          
          git diff --staged --quiet && echo "Tidak ada perubahan" && exit 0
          
          git commit -m "Update database & export XML Blogger [skip ci]"
          git push
